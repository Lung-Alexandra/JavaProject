name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: appointment_booking_system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: appointment_booking_system/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests and package application
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build Docker image
        run: docker build --tag appointment-booking-system:${{ github.sha }} .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: appointment_booking_system/target/surefire-reports/
          if-no-files-found: ignore
